name: Collect IPO data

on:
  schedule:
    # Once a day at 9:07 PM IST, after the evening GMP update. A daily run of about 65 rows
    # costs about $0.20 on Apify. The first run also backfills 12 months of listings (about $2 once).
    - cron: "37 15 * * *"
  workflow_dispatch:
  push:
    paths: ["collect.py", ".github/workflows/collect.yml"]

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and merge
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          IPOGURU_API_KEY: ${{ secrets.IPOGURU_API_KEY }}
        run: python3 collect.py ipos.json
      - name: Commit if changed
        run: |
          if git diff --quiet -- ipos.json listed.json about.json && git ls-files --error-unmatch ipos.json >/dev/null 2>&1; then
            echo "No changes"; exit 0
          fi
          git config user.name "ipo-lens-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ipos.json listed.json about.json
          git commit -m "Update IPO data $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main && git push
